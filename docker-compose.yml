services:
  datasets:
    build: .
    working_dir: /app
    environment:
      KAGGLE_CONFIG_DIR: /root/.kaggle
      KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN:-}
    command: python scripts/fetch_task2_datasets.py
    volumes:
      - .:/app
      - ${HOME}/.kaggle:/root/.kaggle:ro

  task2:
    build: .
    working_dir: /app
    command: python src/run_pipeline.py
    volumes:
      - .:/app

  notebook:
    build: .
    working_dir: /app
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=tickets
    ports:
      - "8888:8888"
    volumes:
      - .:/app
